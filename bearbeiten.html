<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ansagen bearbeiten</title>
<script src="ansagen-daten.js"></script>
<style>
  :root {
    --grund: #12161d;
    --flaeche: #1a202a;
    --flaeche2: #222a36;
    --linie: #323c4b;
    --text: #f3efe6;
    --leise: #a9b0bb;
    --akzent: #e9bd72;
    --warnung: #f08a6c;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--grund); color: var(--text); font: 15px/1.45 var(--sans);
    display: flex; flex-direction: column; color-scheme: dark;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---- Kopfzeile ---- */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 24px; border-bottom: 1px solid var(--linie); background: #0e1218;
  }
  header h1 { font: 500 23px/1 var(--serif); letter-spacing: -.01em; white-space: nowrap; }
  .reiter { display: flex; gap: 4px; background: var(--flaeche); padding: 4px; border-radius: 10px; }
  .reiter button { border: 0; background: none; padding: 7px 16px; border-radius: 7px; color: var(--leise); cursor: pointer; }
  .reiter button.an { background: var(--flaeche2); color: var(--text); box-shadow: inset 0 -2px var(--akzent); }
  .rechts { margin-left: auto; min-width: 0; display: flex; align-items: center; gap: 12px; }
  #status { color: var(--leise); font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reiter, .rechts .knopf { flex: none; }
  #status.offen { color: var(--akzent); }
  #status.fehler { color: var(--warnung); }

  .knopf {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap;
    border: 1px solid var(--linie); background: var(--flaeche); color: var(--text);
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
  }
  .knopf:hover { border-color: #4a586c; background: var(--flaeche2); }
  .knopf.haupt { background: var(--akzent); border-color: var(--akzent); color: #12161d; font-weight: 600; }
  .knopf.haupt:hover { filter: brightness(1.08); }
  .knopf.klein { padding: 4px 9px; font-size: 14px; }
  .knopf.gefahr:hover { border-color: var(--warnung); color: var(--warnung); }
  .knopf:disabled { opacity: .35; cursor: default; }
  :focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }

  #banner { display: none; padding: 12px 24px; background: #4a2a22; color: #ffd9cd; border-bottom: 1px solid var(--warnung); }
  #banner.an { display: block; }

  /* ---- Aufteilung ---- */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 310px minmax(380px, 1fr) minmax(360px, 1.15fr); }
  #liste, #formular, #vorschau { overflow-y: auto; padding: 20px; }
  #liste { border-right: 1px solid var(--linie); background: #151a22; }
  #vorschau { border-left: 1px solid var(--linie); }
  main.einstellungen { grid-template-columns: minmax(380px, 1fr) minmax(360px, 1.15fr); }
  main.einstellungen #liste { display: none; }
  @media (max-width: 1180px) {
    main { grid-template-columns: 280px minmax(0, 1fr); grid-template-rows: auto 1fr; }
    main.einstellungen { grid-template-columns: minmax(0, 1fr); }
    #liste { grid-row: 1 / 3; }
    #vorschau { border-left: 0; border-bottom: 1px solid var(--linie); grid-row: 1; overflow: visible; }
    main:not(.einstellungen) #vorschau, main:not(.einstellungen) #formular { grid-column: 2; }
    #vorschau .rahmen { max-width: 560px; }
  }

  h2 { font: 500 22px/1.2 var(--serif); }
  .ueber {
    font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--akzent);
    margin-bottom: 12px;
  }

  /* ---- Folienliste ---- */
  .eintrag {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center;
    padding: 10px 10px 10px 12px; margin-bottom: 8px; border-radius: 10px; cursor: pointer;
    background: var(--flaeche); border: 1px solid transparent; border-left: 3px solid transparent;
  }
  .eintrag:hover { border-color: var(--linie); border-left-color: var(--linie); }
  .eintrag.an { border-color: var(--linie); border-left-color: var(--akzent); background: var(--flaeche2); }
  .eintrag .name { font: 500 17px/1.25 var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eintrag .unter { font-size: 13px; color: var(--leise); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eintrag.aus .name, .eintrag.aus .unter { opacity: .45; }
  .eintrag .wahl { all: unset; display: block; min-width: 0; cursor: pointer; }
  .eintrag .wahl:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; border-radius: 4px; }
  .eintrag .tasten { display: flex; gap: 4px; }
  .marken { grid-column: 1 / 3; display: flex; gap: 6px; flex-wrap: wrap; }
  .marken:empty { display: none; }
  .marke { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; }
  .marke.rot { background: var(--warnung); color: #12161d; }
  .marke.grau { background: #3a4454; color: var(--text); }
  #liste .neu { width: 100%; justify-content: center; margin-top: 6px; border-style: dashed; }

  /* ---- Formular ---- */
  .karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .kopfzeile { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .kopfzeile h2 { margin-right: auto; }
  label.feld { display: block; margin-bottom: 14px; }
  label.feld:last-child { margin-bottom: 0; }
  label.feld > span { display: block; font-size: 13px; color: var(--leise); margin-bottom: 5px; }
  .hilfe { font-size: 13px; color: var(--leise); margin-top: 6px; }
  input[type=text], input[type=number], input[type=time], input[type=date], select, textarea {
    width: 100%; background: #10141a; border: 1px solid var(--linie); border-radius: 8px; padding: 8px 10px;
  }
  textarea { resize: vertical; min-height: 76px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--akzent); }
  .zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .haken { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .haken input { width: 18px; height: 18px; accent-color: var(--akzent); flex: none; }
  .haken + .feld, .haken + .hilfe { margin-top: 12px; }

  .termin {
    display: grid; grid-template-columns: 110px 1fr 1fr auto; gap: 8px; align-items: center;
    padding: 10px; margin-bottom: 8px; border-radius: 10px; background: #161b23; border: 1px solid var(--linie);
  }
  .termin .unten { grid-column: 1 / 5; display: flex; align-items: center; gap: 12px; }
  .termin .unten input[type=text] { flex: 1; }
  .termin .tasten { display: flex; gap: 4px; }
  .datum { display: flex; gap: 8px; margin-bottom: 8px; max-width: 280px; }
  .wahlreihe { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
  .bildreihe { display: flex; gap: 8px; }
  .bildreihe select { flex: 1; }

  /* ---- Vorschau ---- */
  #vorschau .rahmen {
    position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
    border-radius: 10px; overflow: hidden; border: 1px solid var(--linie); box-shadow: 0 20px 50px #0008;
  }
  #vorschau iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  #vorschau .hilfe { margin-top: 10px; }
  #vorschau .blaettern { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  #versteckt { color: var(--akzent); }
</style>
</head>
<body>
<header>
  <h1>Ansagen bearbeiten</h1>
  <div class="reiter">
    <button id="reiter-folien" class="an">Folien</button>
    <button id="reiter-einstellungen">Einstellungen</button>
  </div>
  <div class="rechts">
    <span id="status" role="status"></span>
    <a class="knopf" href="ansagen.html" target="_blank" title="Zeigt den gespeicherten Stand in einem neuen Tab">Ansagen öffnen ↗</a>
    <a class="knopf" href="ansagen.html?in=90" target="_blank" title="Zählt zum Ausprobieren 90 Sekunden herunter">Probelauf ↗</a>
    <button class="knopf haupt" id="speichern">Speichern</button>
  </div>
</header>
<div id="banner"></div>
<main>
  <nav id="liste"></nav>
  <section id="formular"></section>
  <aside id="vorschau">
    <div class="ueber">Vorschau</div>
    <div class="rahmen"><iframe id="rahmen" src="ansagen.html?vorschau" title="Vorschau der Folie"></iframe></div>
    <div class="blaettern">
      <button class="knopf klein" id="zurueck" title="Vorherige Folie">←</button>
      <button class="knopf klein" id="weiter" title="Nächste Folie">→</button>
      <span class="hilfe" id="position" style="margin:0"></span>
    </div>
    <p class="hilfe" id="versteckt"></p>
    <p class="hilfe">Die Vorschau zeigt sofort, was du eintippst. Auf der Ansagen-Seite erscheint es erst nach „Speichern“.</p>
  </aside>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const TAGE = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  const TEXTFELDER = ["rubrik", "titel", "wann", "bibelstelle", "text"];
  const BEKANNT = ["anzeigen", "ausfall", "liste", "bild", "bildGross", ...TEXTFELDER];

  /* Kleiner Helfer zum Bauen von Elementen */
  function h(tag, eig, ...kinder) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(eig || {})) {
      if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "class") el.className = v;
      else if (v === true) el.setAttribute(k, "");
      else if (v !== false && v != null) el.setAttribute(k, v);
    }
    kinder.flat().forEach(c => c != null && el.append(c));
    return el;
  }

  function banner(text) { $("banner").textContent = text; $("banner").classList.toggle("an", !!text); }

  if (typeof EINSTELLUNGEN === "undefined" || typeof ANSAGEN === "undefined") {
    banner("Die Datei ansagen-daten.js fehlt oder enthält einen Fehler. Sie muss im selben Ordner liegen wie diese Seite. " +
           "Der letzte Stand vor dem Speichern liegt als ansagen-daten.sicherung.js daneben.");
    $("speichern").disabled = true;
    return;
  }

  /* ---- Daten: Datei-Format <-> Bearbeitungs-Format ---- */
  function ausDaten(a) {
    const rest = {};                                   // unbekannte Felder bleiben erhalten
    for (const k in a) if (!BEKANNT.includes(k)) rest[k] = a[k];
    const f = { rest, anzeigen: a.anzeigen !== false, ausAn: !!a.ausfall, ausText: a.ausfall || "",
                bild: a.bild || "", bildGross: !!a.bildGross };
    TEXTFELDER.forEach(k => f[k] = a[k] || "");
    f.zeilen = (a.liste || []).map(z => {
      const t = String(z).split("|").map(s => s.trim());
      return { zeit: t[0] || "", name: t[1] || "", zusatz: t[2] || "", ausAn: !!t[3], ausText: t[3] || "" };
    });
    return f;
  }
  const sauber = s => s.replace(/\|/g, "/").trim();    // der Strich trennt die Teile einer Zeile
  function zuDaten(f) {
    const a = { ...f.rest, anzeigen: f.anzeigen };
    TEXTFELDER.forEach(k => { if (f[k].trim()) a[k] = f[k].trim(); });
    if (f.ausAn) a.ausfall = f.ausText.trim() || "Fällt aus";
    const liste = f.zeilen.filter(z => z.zeit.trim() || z.name.trim() || z.zusatz.trim()).map(z => {
      const teile = [sauber(z.zeit), sauber(z.name), sauber(z.zusatz)];
      if (z.ausAn) teile.push(sauber(z.ausText) || "fällt aus");
      else while (teile.length > 1 && !teile[teile.length - 1]) teile.pop();
      return teile.join(" | ");
    });
    if (liste.length) a.liste = liste;
    if (f.bild) { a.bild = f.bild; if (f.bildGross) a.bildGross = true; }
    return a;
  }
  function einstZuDaten() {
    const e = { ...einst };
    e.wochentag = Number(e.wochentag) || 0;
    e.frueherAmSonntagNr = Number(e.frueherAmSonntagNr) || 0;
    e.frueherAnTerminen = [...new Set((e.frueherAnTerminen || []).filter(Boolean))].sort();
    e.sekundenProFolie = Math.max(1, Number(e.sekundenProFolie) || 12);
    e.grosserCountdownAb = Math.max(0, Number(e.grosserCountdownAb) || 0);
    e.kleineUhrInDerEcke = !!e.kleineUhrInDerEcke;
    return e;
  }

  const einst = JSON.parse(JSON.stringify(EINSTELLUNGEN));
  if (!Array.isArray(einst.frueherAnTerminen)) einst.frueherAnTerminen = [];
  const folien = ANSAGEN.map(ausDaten);
  let gewaehlt = 0, ansicht = "folien", offen = false, bilder = [];

  /* ---- Status, Speichern ---- */
  function status(text, art) { $("status").textContent = text; $("status").className = art || ""; }
  function geaendert() {
    offen = true;
    status("Ungespeicherte Änderungen", "offen");
    zeichneListe();
    vorschauBald();
  }
  async function speichern() {
    status("Speichere …");
    try {
      const r = await fetch("/api/speichern", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Ansagen": "1" },
        body: JSON.stringify({ einstellungen: einstZuDaten(), ansagen: folien.map(zuDaten) })
      });
      const antwort = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(antwort.fehler || "Fehler " + r.status);
      offen = false;
      banner("");
      status("Gespeichert um " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr");
    } catch (fehler) {
      status("Nicht gespeichert", "fehler");
      banner(ohneServer()
        ? "Speichern geht nur, wenn du diese Seite über „Ansagen bearbeiten.command“ gestartet hast (Doppelklick im Ordner)."
        : "Speichern hat nicht geklappt. Läuft das Terminal-Fenster von „Ansagen bearbeiten“ noch? Wenn nicht: „Ansagen bearbeiten.command“ erneut doppelklicken und dann noch einmal speichern. (" + fehler.message + ")");
    }
  }
  const ohneServer = () => location.protocol === "file:";
  $("speichern").addEventListener("click", speichern);
  addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); speichern(); }
  });
  addEventListener("beforeunload", e => { if (offen) { e.preventDefault(); e.returnValue = ""; } });

  /* ---- Vorschau: schickt den aktuellen Stand an die eingebettete Ansagen-Seite ---- */
  let bereit = false, wartet = null;
  function vorschau() {
    const sichtbar = folien.filter((f, i) => f.anzeigen || i === gewaehlt);
    const nr = Math.max(0, sichtbar.indexOf(folien[gewaehlt]));
    const f = folien[gewaehlt];
    $("position").textContent = folien.length ? `Folie ${gewaehlt + 1} von ${folien.length}` : "Noch keine Folie";
    $("versteckt").textContent = f && !f.anzeigen ? "Diese Folie ist ausgeblendet und läuft nicht in der Schleife mit." : "";
    if (!bereit) return;
    $("rahmen").contentWindow.postMessage(
      { einstellungen: einstZuDaten(), ansagen: sichtbar.map(x => ({ ...zuDaten(x), anzeigen: true })), nr }, "*");
  }
  function vorschauBald() { clearTimeout(wartet); wartet = setTimeout(vorschau, 120); }
  addEventListener("message", e => {
    if (e.source === $("rahmen").contentWindow && e.data && e.data.vorschauBereit) { bereit = true; vorschau(); }
  });

  /* ---- Bausteine fürs Formular ---- */
  function feld(titel, obj, key, opt = {}) {
    const eingabe = h(opt.mehrzeilig ? "textarea" : "input", {
      type: opt.mehrzeilig ? null : (opt.typ || "text"),
      placeholder: opt.beispiel, min: opt.min, rows: opt.mehrzeilig ? 3 : null,
      oninput: () => {
        if (opt.pflicht && !eingabe.value) return;     // z. B. eine geleerte Uhrzeit nicht übernehmen
        obj[key] = eingabe.value;
        geaendert();
      }
    });
    eingabe.value = obj[key] == null ? "" : obj[key];
    return h("label", { class: "feld" }, h("span", {}, titel), eingabe, opt.hilfe ? h("div", { class: "hilfe" }, opt.hilfe) : null);
  }
  function haken(titel, obj, key, danach) {
    const box = h("input", { type: "checkbox", onchange: () => { obj[key] = box.checked; geaendert(); if (danach) danach(); } });
    box.checked = !!obj[key];
    return h("label", { class: "haken" }, box, h("span", {}, titel));
  }
  function auswahl(titel, obj, key, optionen, danach) {
    const sel = h("select", { onchange: () => { obj[key] = sel.value; geaendert(); if (danach) danach(); } },
      optionen.map(([wert, text]) => h("option", { value: wert }, text)));
    sel.value = String(obj[key]);
    return h("label", { class: "feld" }, h("span", {}, titel), sel);
  }
  function verschieben(feldliste, i, um) {
    const j = i + um;
    if (j < 0 || j >= feldliste.length) return false;
    [feldliste[i], feldliste[j]] = [feldliste[j], feldliste[i]];
    return true;
  }
  const taste = (text, titel, klick, mehr = {}) =>
    h("button", { class: "knopf klein " + (mehr.klasse || ""), title: titel, "aria-label": titel, disabled: !!mehr.aus, onclick: e => { e.stopPropagation(); klick(); } }, text);

  /* ---- Folienliste links ---- */
  function waehle(i) { gewaehlt = Math.max(0, Math.min(folien.length - 1, i)); zeichneListe(); zeichneFormular(); $("formular").scrollTop = 0; vorschau(); }
  function nameVon(f) { return f.titel.trim() || (f.bild ? "Flyer: " + f.bild : "(ohne Titel)"); }
  function zeichneListe() {
    const liste = $("liste");
    const oben = liste.scrollTop;
    liste.textContent = "";
    liste.append(h("div", { class: "ueber" }, "Folien in dieser Reihenfolge"));
    folien.forEach((f, i) => {
      const fallenAus = f.zeilen.filter(z => z.ausAn && (z.name.trim() || z.zeit.trim())).length;
      liste.append(h("div", { class: "eintrag" + (i === gewaehlt ? " an" : "") + (f.anzeigen ? "" : " aus"), onclick: () => waehle(i) },
        h("button", { class: "wahl", "aria-current": i === gewaehlt ? "true" : null },
          h("div", { class: "name" }, nameVon(f)),
          h("div", { class: "unter" }, [f.rubrik.trim(), f.wann.trim()].filter(Boolean).join(" · ") || (f.zeilen.length ? f.zeilen.length + " Termine" : " "))),
        h("div", { class: "tasten" },
          taste("↑", "Nach oben", () => { if (verschieben(folien, i, -1)) { if (gewaehlt === i) gewaehlt--; else if (gewaehlt === i - 1) gewaehlt++; geaendert(); zeichneFormular(); } }, { aus: i === 0 }),
          taste("↓", "Nach unten", () => { if (verschieben(folien, i, 1)) { if (gewaehlt === i) gewaehlt++; else if (gewaehlt === i + 1) gewaehlt--; geaendert(); zeichneFormular(); } }, { aus: i === folien.length - 1 })),
        h("div", { class: "marken" },
          f.anzeigen ? null : h("span", { class: "marke grau" }, "Ausgeblendet"),
          f.ausAn ? h("span", { class: "marke rot" }, "Fällt aus") : null,
          fallenAus ? h("span", { class: "marke rot" }, fallenAus === 1 ? "1 Termin fällt aus" : fallenAus + " Termine fallen aus") : null)));
    });
    liste.append(h("button", { class: "knopf neu", onclick: neueFolie }, "+ Neue Folie"));
    liste.scrollTop = oben;
  }
  function neueFolie() {
    folien.push(ausDaten({ rubrik: "", titel: "Neue Folie" }));
    geaendert();
    waehle(folien.length - 1);
    document.querySelectorAll("#formular input[type=text]")[2]?.select();   // Titel zum Überschreiben markieren
  }

  /* ---- Formular einer Folie ---- */
  function zeichneFormular() {
    const form = $("formular");
    form.textContent = "";
    if (ansicht === "einstellungen") return zeichneEinstellungen(form);
    const f = folien[gewaehlt];
    if (!f) {
      form.append(h("div", { class: "karte" }, h("h2", {}, "Noch keine Folie"), h("p", { class: "hilfe" }, "Lege links mit „+ Neue Folie“ die erste an.")));
      return;
    }
    const neu = () => zeichneFormular();

    form.append(h("div", { class: "karte" },
      h("div", { class: "kopfzeile" },
        h("h2", {}, "Folie " + (gewaehlt + 1)),
        taste("Duplizieren", "Kopie dieser Folie anlegen", () => {
          folien.splice(gewaehlt + 1, 0, ausDaten(zuDaten(f)));
          geaendert(); waehle(gewaehlt + 1);
        }),
        taste("Löschen", "Diese Folie löschen", () => {
          if (!confirm(`Folie „${nameVon(f)}“ wirklich löschen?`)) return;
          folien.splice(gewaehlt, 1);
          geaendert(); waehle(gewaehlt);
        }, { klasse: "gefahr" })),
      haken("Folie anzeigen", f, "anzeigen"),
      h("div", { class: "hilfe" }, "Ohne Haken bleibt die Folie hier erhalten, läuft aber nicht mit – praktisch für Termine, die nicht jede Woche stattfinden.")));

    form.append(h("div", { class: "karte" },
      h("div", { class: "ueber" }, "Text"),
      h("div", { class: "zwei" },
        feld("Rubrik (kleines Schlagwort oben)", f, "rubrik", { beispiel: "z. B. Montag" }),
        feld("Wann / Wo", f, "wann", { beispiel: "z. B. Montag · 16:00 Uhr" })),
      feld("Titel", f, "titel"),
      feld("Bibelstelle", f, "bibelstelle", { beispiel: "z. B. Matthäus 1 – darf leer bleiben" }),
      feld("Text", f, "text", { mehrzeilig: true, beispiel: "Ein, zwei Sätze" })));

    form.append(h("div", { class: "karte" },
      h("div", { class: "ueber" }, "Fällt aus"),
      haken("Ganze Folie als ausgefallen markieren", f, "ausAn", () => {
        if (f.ausAn && !f.ausText.trim()) f.ausText = "Fällt diese Woche aus";
        neu();
      }),
      f.ausAn ? feld("Text der roten Marke", f, "ausText", { beispiel: "Fällt diese Woche aus" })
              : h("div", { class: "hilfe" }, "Der Titel wird durchgestrichen und eine rote Marke mit deinem Text erscheint.")));

    form.append(h("div", { class: "karte" },
      h("div", { class: "ueber" }, "Mehrere Termine auf dieser Folie"),
      f.zeilen.map((z, i) => {
        const eingabe = (key, beispiel) => {
          const el = h("input", { type: "text", placeholder: beispiel, "aria-label": beispiel, oninput: () => { z[key] = el.value; geaendert(); } });
          el.value = z[key];
          return el;
        };
        return h("div", { class: "termin" },
          eingabe("zeit", "Uhrzeit"), eingabe("name", "Name"), eingabe("zusatz", "Zusatz (optional)"),
          h("div", { class: "tasten" },
            taste("↑", "Termin nach oben", () => { if (verschieben(f.zeilen, i, -1)) { geaendert(); neu(); } }, { aus: i === 0 }),
            taste("↓", "Termin nach unten", () => { if (verschieben(f.zeilen, i, 1)) { geaendert(); neu(); } }, { aus: i === f.zeilen.length - 1 }),
            taste("✕", "Termin entfernen", () => { f.zeilen.splice(i, 1); geaendert(); neu(); }, { klasse: "gefahr" })),
          h("div", { class: "unten" },
            haken("Fällt aus", z, "ausAn", () => { if (z.ausAn && !z.ausText.trim()) z.ausText = "fällt aus"; neu(); }),
            z.ausAn ? eingabe("ausText", "Text der roten Marke") : null));
      }),
      taste("+ Termin", "Termin hinzufügen", () => {
        f.zeilen.push({ zeit: "", name: "", zusatz: "", ausAn: false, ausText: "" });
        geaendert(); neu();
        const zeilen = form.querySelectorAll(".termin");
        zeilen[zeilen.length - 1].querySelector("input").focus();
      }),
      h("div", { class: "hilfe" }, "Für Folien wie „Freitags bei uns“: jede Zeile ist ein Termin mit Uhrzeit, Name und Zusatz.")));

    const namen = bilder.includes(f.bild) || !f.bild ? bilder : [f.bild, ...bilder];
    const datei = h("input", { type: "file", accept: ".png,.jpg,.jpeg,.gif,.webp,.svg,image/*", hidden: true, onchange: () => bildHochladen(f, datei.files[0]) });
    const lage = (wert, text) => {
      const r = h("input", { type: "radio", name: "lage", onchange: () => { f.bildGross = wert; geaendert(); } });
      r.checked = f.bildGross === wert;
      return h("label", { class: "haken" }, r, h("span", {}, text));
    };
    const bildwahl = auswahl("Bild aus dem Ansagen-Ordner", f, "bild",
      [["", "– kein Bild –"], ...namen.map(n => [n, n + (bilder.includes(n) || !bilder.length ? "" : " (nicht im Ordner gefunden)")])], neu);
    form.append(h("div", { class: "karte" },
      h("div", { class: "ueber" }, "Flyer / Bild"),
      bildwahl, datei,
      taste("Bild vom Mac hinzufügen …", "Kopiert ein Bild in den Ansagen-Ordner und wählt es aus", () => datei.click()),
      f.bild ? h("div", { class: "wahlreihe" }, lage(false, "Rechts neben dem Text"), lage(true, "Bildschirmfüllend (nur das Bild)")) : null));
  }

  async function bildHochladen(f, datei) {
    if (!datei) return;
    try {
      const r = await fetch("/api/bild?name=" + encodeURIComponent(datei.name), { method: "POST", headers: { "X-Ansagen": "1" }, body: datei });
      const antwort = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(antwort.fehler || "Fehler " + r.status);
      bilder = antwort.bilder;
      f.bild = antwort.name;
      banner("");
      geaendert();
      zeichneFormular();
    } catch (fehler) {
      banner(ohneServer()
        ? "Bilder hinzufügen geht nur, wenn du diese Seite über „Ansagen bearbeiten.command“ gestartet hast."
        : "Das Bild konnte nicht hinzugefügt werden: " + fehler.message);
    }
  }

  /* ---- Einstellungen ---- */
  function zeichneEinstellungen(form) {
    const tag = TAGE[Number(einst.wochentag) || 0];
    const neu = () => zeichneFormular();
    form.append(h("div", { class: "karte" },
      h("div", { class: "ueber" }, "Gottesdienst"),
      feld("Name der Gemeinde (oben links)", einst, "gemeinde"),
      h("div", { class: "zwei" },
        auswahl("Wochentag", einst, "wochentag", TAGE.map((t, i) => [i, t]), () => { einst.wochentag = Number(einst.wochentag); neu(); }),
        feld("Beginn", einst, "beginn", { typ: "time", pflicht: true }))));

    form.append(h("div", { class: "karte" },
      h("div", { class: "ueber" }, "Früherer Beginn"),
      h("div", { class: "zwei" },
        auswahl("Regelmäßig früher", einst, "frueherAmSonntagNr",
          [[0, "nie"], ...[1, 2, 3, 4, 5].map(n => [n, `am ${n}. ${tag} im Monat`])],
          () => { einst.frueherAmSonntagNr = Number(einst.frueherAmSonntagNr); }),
        feld("Uhrzeit des früheren Beginns", einst, "frueherBeginn", { typ: "time", pflicht: true })),
      h("label", { class: "feld" }, h("span", {}, "Zusätzlich an diesen einzelnen Tagen früher")),
      einst.frueherAnTerminen.map((d, i) => {
        const el = h("input", { type: "date", "aria-label": "Datum", oninput: () => { einst.frueherAnTerminen[i] = el.value; geaendert(); } });
        el.value = d;
        return h("div", { class: "datum" }, el, taste("✕", "Datum entfernen", () => { einst.frueherAnTerminen.splice(i, 1); geaendert(); neu(); }, { klasse: "gefahr" }));
      }),
      taste("+ Datum", "Einzelnen Tag hinzufügen", () => { einst.frueherAnTerminen.push(""); neu(); })));

    form.append(h("div", { class: "karte" },
      h("div", { class: "ueber" }, "Ablauf"),
      h("div", { class: "zwei" },
        feld("Sekunden pro Folie", einst, "sekundenProFolie", { typ: "number", min: 1 }),
        feld("Großer Countdown ab … Sekunden vor Beginn", einst, "grosserCountdownAb", { typ: "number", min: 0 })),
      haken("Restzeit dauerhaft unten rechts zeigen", einst, "kleineUhrInDerEcke")));

    form.append(h("div", { class: "karte" },
      h("div", { class: "ueber" }, "Schlussbild (wenn der Countdown abgelaufen ist)"),
      feld("Große Zeile", einst, "schlussTitel"),
      feld("Kleine Zeile darunter", einst, "schlussText")));
  }

  /* ---- Reiter, Blättern, Start ---- */
  function zeigeAnsicht(name) {
    ansicht = name;
    $("reiter-folien").classList.toggle("an", name === "folien");
    $("reiter-einstellungen").classList.toggle("an", name === "einstellungen");
    document.querySelector("main").classList.toggle("einstellungen", name === "einstellungen");
    zeichneFormular();
  }
  $("reiter-folien").addEventListener("click", () => zeigeAnsicht("folien"));
  $("reiter-einstellungen").addEventListener("click", () => zeigeAnsicht("einstellungen"));
  $("zurueck").addEventListener("click", () => waehle(gewaehlt - 1));
  $("weiter").addEventListener("click", () => waehle(gewaehlt + 1));

  zeichneListe();
  zeichneFormular();
  vorschau();
  if (ohneServer()) {
    banner("Du hast diese Seite direkt geöffnet – so kann sie nicht speichern. Bitte im Ordner „Ansagen bearbeiten.command“ doppelklicken.");
  } else {
    fetch("/api/bilder").then(r => r.json()).then(d => { bilder = d.bilder || []; if (ansicht === "folien") zeichneFormular(); }).catch(() => {});
  }
})();
</script>
</body>
</html>
