<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ansagen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style id="stil">
/* ===================================================================
   Ansagen – eine einzige Datei: Anzeige, Bearbeiten, Inhalte und Bilder.
   Teil 1: die Bühne (das, was der Beamer zeigt) · Teil 2: das Bearbeiten
   =================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; }
[hidden] { display: none !important; }

/* ---------- Teil 1: Bühne, fest 1920×1080, wird auf ihren Rahmen skaliert ---------- */
.rahmen { position: relative; overflow: hidden; background: #000; }
.buehne {
  --grund: #10141b; --grund2: #1b2a3a; --grund3: #4a3520;
  --text: #f4efe4; --leise: #aab2bf; --akzent: #e6b869; --linie: #ffffff22;
  --warn: #f08a6c; --warntext: #1a1210; --fuss: #0a0d12b0;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Constantia, Georgia, serif;
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
  background: var(--grund); color: var(--text); overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.buehne.morgen {
  --grund: #f5efe3; --grund2: #ffffff; --grund3: #ecd9b8;
  --text: #1c232e; --leise: #566170; --akzent: #9c4f1c; --linie: #1c232e22;
  --warn: #b93a26; --warntext: #fff; --fuss: #ffffff8c;
}
.licht { position: absolute; border-radius: 50%; }
.licht.a { width: 1700px; height: 1700px; left: -600px; top: -800px;
  background: radial-gradient(closest-side, var(--grund2), transparent); animation: wandern-a 50s ease-in-out infinite alternate; }
.licht.b { width: 1500px; height: 1500px; right: -500px; bottom: -700px; opacity: .8;
  background: radial-gradient(closest-side, var(--grund3), transparent); animation: wandern-b 64s ease-in-out infinite alternate; }
@keyframes wandern-a { to { transform: translate(420px, 260px) scale(1.15); } }
@keyframes wandern-b { to { transform: translate(-460px, -220px) scale(1.2); } }
.still .licht, .still .bildflaeche img { animation: none !important; }

.folie { position: absolute; left: 0; top: 0; width: 1920px; height: 930px; opacity: 0; transition: opacity 1.3s ease; }
.folie.aktiv { opacity: 1; }
.inhalt {
  position: absolute; left: 130px; top: 80px; width: 1660px; height: 790px;
  display: flex; flex-direction: column; justify-content: center;
  font-size: calc(40px * var(--f, 1));           /* --f verkleinert alles, wenn der Text sonst nicht passt */
}
.satz > * { transform: translateY(28px); opacity: 0; transition: transform 1.5s cubic-bezier(.2,.7,.2,1), opacity 1.2s ease; }
.folie.aktiv .satz > * { transform: none; opacity: 1; }
.folie.aktiv .satz > :nth-child(2) { transition-delay: .10s; }
.folie.aktiv .satz > :nth-child(3) { transition-delay: .20s; }
.folie.aktiv .satz > :nth-child(4) { transition-delay: .30s; }
.folie.aktiv .satz > :nth-child(5) { transition-delay: .40s; }
.folie.aktiv .satz > :nth-child(n+6) { transition-delay: .50s; }
.still .folie, .still .satz > * { transition: none; }

.rubrik { display: inline-block; font-size: .7em; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
  color: var(--akzent); padding-bottom: .6em; margin-bottom: 1.3em; border-bottom: 3px solid var(--akzent); }
.titel { font-family: var(--serif); font-weight: 500; font-size: 3.3em; line-height: 1.05; letter-spacing: -.01em;
  text-wrap: balance; overflow-wrap: break-word; hyphens: auto; }
.wann { margin-top: 1.05em; font-size: 1.05em; font-weight: 600; color: var(--akzent); }
.stelle { margin-top: .55em; font-family: var(--serif); font-style: italic; font-size: 1.5em; }
.text { margin-top: .65em; font-size: 1.15em; line-height: 1.36; color: var(--leise); max-width: 34em; white-space: pre-line; }
.kompakt .titel { font-size: 2.4em; }
.kompakt .rubrik { margin-bottom: .9em; }
.termine { margin-top: 1.1em; display: grid; grid-template-columns: auto auto 1fr; column-gap: 1.4em; row-gap: .42em; align-items: baseline; }
.termine .zeit { font-weight: 600; color: var(--akzent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.termine .name { font-family: var(--serif); font-size: 1.4em; }
.termine .notiz { color: var(--leise); }
.termine .aus { text-decoration: line-through; text-decoration-thickness: .07em; opacity: .45; }

.marke { display: inline-block; font-size: .85em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--warntext); background: var(--warn); padding: .28em .7em; border-radius: .3em; }
.satz > .marke { margin-top: .9em; font-size: 1em; align-self: flex-start; }
.abgesagt .titel { text-decoration: line-through; text-decoration-thickness: .05em; opacity: .45; font-size: 2.6em; }
.abgesagt .wann, .abgesagt .stelle, .abgesagt .text, .abgesagt .termine { opacity: .45; }

/* Bild rechts neben dem Text */
.art-seite .inhalt { width: 960px; }
.art-seite .bildflaeche { position: absolute; left: 1150px; top: 70px; width: 660px; height: 800px;
  display: flex; align-items: center; justify-content: center; }
.art-seite .bild { max-width: 100%; max-height: 100%; border-radius: 16px; box-shadow: 0 30px 80px #0008; }
/* Bild füllt die ganze Folie; hinter dem Bild liegt dasselbe Bild weichgezeichnet statt schwarzer Balken */
.art-voll .bildflaeche { position: absolute; inset: 0; overflow: hidden; background: #000; }
.art-voll .weich { position: absolute; inset: -80px; width: calc(100% + 160px); height: calc(100% + 160px);
  object-fit: cover; filter: blur(50px) brightness(.55); }
.art-voll .bild { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
/* Bild als Hintergrund hinter dem Text */
.art-hinter { --text: #f4efe4; --leise: #d5d9df; --akzent: #f0c67c; color: var(--text); }
.art-hinter .bildflaeche { position: absolute; inset: 0; overflow: hidden; background: #000; }
.art-hinter .bild { width: 100%; height: 100%; object-fit: cover; }
.art-hinter.aktiv .bild { animation: zoom 40s ease-out forwards; }
@keyframes zoom { from { transform: scale(1); } to { transform: scale(1.12); } }
.art-hinter .bildflaeche::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, #080b10ee 0%, #080b10b8 45%, #080b1055 100%); }
.art-hinter .inhalt { text-shadow: 0 2px 24px #000a; }

/* Fuß: Gemeinde, Punkte, Countdown */
.fuss { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: var(--fuss);
  border-top: 1px solid var(--linie); display: flex; align-items: center; padding: 0 130px; gap: 60px; }
.gemeinde { font-size: 28px; letter-spacing: .22em; text-transform: uppercase; color: var(--leise); white-space: nowrap; }
.punkte { flex: 1; display: flex; gap: 14px; justify-content: center; }
.punkte i { width: 12px; height: 12px; border-radius: 6px; background: var(--linie); transition: all .6s; }
.punkte i.an { width: 52px; background: var(--akzent); }
.uhr { display: flex; align-items: baseline; gap: 26px; transition: opacity 1s; }
.uhr span { font-size: 26px; letter-spacing: .16em; text-transform: uppercase; color: var(--leise); white-space: nowrap; }
.uhr strong { font-size: 92px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; min-width: 3.2ch; text-align: right; }
.balken { position: absolute; left: 0; bottom: 0; height: 6px; width: 100%; }
.balken b { display: block; height: 100%; width: 0; background: var(--akzent); }
.balken b.laeuft { animation: fuellen linear forwards; }
.balken b.halt { animation-play-state: paused; }
@keyframes fuellen { to { width: 100%; } }
.pause { position: absolute; right: 40px; top: 30px; font-size: 22px; letter-spacing: .1em; color: var(--leise); }

/* Die letzten Sekunden und das Schlussbild */
.gross { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--grund); opacity: 0; pointer-events: none; transition: opacity 1.6s ease; text-align: center; }
.gross.an { opacity: 1; }
.gross .licht { opacity: .9; }
.gross svg { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; transform: rotate(-90deg); }
.gross circle { fill: none; stroke-width: 6; }
.gross .spur { stroke: var(--linie); }
.gross .ring { stroke: var(--akzent); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.gross span { position: relative; font-size: 38px; letter-spacing: .24em; text-transform: uppercase; color: var(--akzent); }
.gross strong { position: relative; font-size: 440px; font-weight: 200; line-height: 1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.gross em { position: relative; font-style: normal; font-size: 54px; color: var(--leise); display: none; }
.gross.ende svg, .gross.ende span { display: none; }
.gross.ende strong { font-family: var(--serif); font-weight: 500; font-size: 170px; line-height: 1.1; margin: 0 100px 36px; text-wrap: balance; }
.gross.ende em { display: block; }

/* ---------- Anzeige im ganzen Fenster ---------- */
#anzeige { position: fixed; inset: 0; }
#anzeige .rahmen { width: 100%; height: 100%; }
body.ruhig #anzeige { cursor: none; }
#leiste { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
  background: #000c; color: #fff; padding: 8px 10px 8px 18px; border-radius: 30px; font-size: 14px; transition: opacity .6s; white-space: nowrap; }
#leiste button { font: inherit; color: #fff; background: #ffffff26; border: 0; border-radius: 20px; padding: 7px 14px; cursor: pointer; }
#leiste button:hover { background: #ffffff45; }
body.ruhig #leiste { opacity: 0; pointer-events: none; }

/* ---------- Teil 2: Bearbeiten ---------- */
#werkstatt {
  --w-grund: #f3f1ec; --w-flaeche: #fff; --w-rand: #d9d5cc; --w-text: #1e242c; --w-leise: #687280; --w-akzent: #1f5f8b; --w-rot: #b93a26;
  position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; background: var(--w-grund); color: var(--w-text); font-size: 15px; line-height: 1.4;
}
#werkstatt button, #werkstatt input, #werkstatt select, #werkstatt textarea { font: inherit; color: inherit; }
#werkstatt header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: var(--w-flaeche); border-bottom: 1px solid var(--w-rand); flex-wrap: wrap; }
#werkstatt h1 { font-size: 19px; font-weight: 650; margin-right: 6px; }
.reiter { display: flex; background: var(--w-grund); border-radius: 9px; padding: 3px; }
.reiter button { border: 0; background: none; padding: 6px 16px; border-radius: 7px; color: var(--w-leise); cursor: pointer; }
.reiter button.an { background: var(--w-flaeche); color: var(--w-text); box-shadow: 0 1px 3px #0002; font-weight: 600; }
.stand { margin-left: auto; font-size: 13.5px; color: var(--w-leise); }
.stand.offen { color: #9a5a00; font-weight: 600; }
.knopf { border: 1px solid var(--w-rand); background: var(--w-flaeche); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
.knopf:hover { border-color: #9aa3ad; }
.knopf:disabled { opacity: .35; cursor: default; }
.knopf.haupt { background: var(--w-akzent); border-color: var(--w-akzent); color: #fff !important; font-weight: 600; padding: 7px 22px; }
.knopf.klein { padding: 3px 9px; font-size: 13.5px; }
.knopf.rot { color: var(--w-rot) !important; }
.spalten { display: grid; grid-template-columns: 300px minmax(380px, 1fr) minmax(360px, 44%); min-height: 0; }
.spalten > * { overflow-y: auto; min-height: 0; }
#liste { padding: 14px; border-right: 1px solid var(--w-rand); }
.karte { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; margin-bottom: 4px; }
.karte:hover { background: #0000000a; }
.karte.an { background: var(--w-flaeche); border-color: var(--w-akzent); }
.karte .mini { width: 96px; height: 54px; border-radius: 5px; pointer-events: none; }
.karte.blass .mini { opacity: .35; }
.karte b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.karte .kt { min-width: 0; }
.karte .kk { display: flex; flex-direction: column; gap: 3px; }
.karte .kk .knopf { padding: 0 7px; font-size: 12px; line-height: 1.5; }
.schild { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 9px; background: #e4e1da; color: #4c5560; margin: 2px 4px 0 0; }
.schild.rot { background: #f6d9d3; color: #8e2a1a; }
.schild.gelb { background: #f8e7bd; color: #7a5200; }
.neu { width: 100%; margin-top: 10px; padding: 10px; border-style: dashed; }
#formular { padding: 20px 24px 60px; }
.block { background: var(--w-flaeche); border: 1px solid var(--w-rand); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
.block h2 { font-size: 15px; font-weight: 650; margin-bottom: 12px; }
.block h2 small { font-weight: 400; color: var(--w-leise); margin-left: 6px; }
.feld { display: block; margin-bottom: 12px; }
.feld:last-child { margin-bottom: 0; }
.feld > span { display: block; font-size: 13px; color: var(--w-leise); margin-bottom: 4px; }
#werkstatt input[type=text], #werkstatt input[type=number], #werkstatt input[type=date], #werkstatt input[type=time], #werkstatt select, #werkstatt textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--w-rand); border-radius: 8px; background: #fff; }
#werkstatt textarea { resize: vertical; min-height: 70px; }
#werkstatt input:focus, #werkstatt select:focus, #werkstatt textarea:focus { outline: 2px solid var(--w-akzent); outline-offset: -1px; }
.hilfe { font-size: 13px; color: var(--w-leise); margin-top: 5px; }
.haken { display: flex; align-items: center; gap: 9px; cursor: pointer; margin-bottom: 8px; }
.haken input { width: 18px; height: 18px; accent-color: var(--w-akzent); flex: none; }
.zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.zwei .feld { margin-bottom: 12px; }
.termin { display: grid; grid-template-columns: 110px 1fr 1fr auto; gap: 6px; margin-bottom: 4px; align-items: center; }
.termin .tk { display: flex; gap: 3px; }
.termin-aus { display: flex; align-items: center; gap: 10px; margin: 0 0 12px 2px; font-size: 13.5px; }
.termin-aus .haken { margin: 0; }
.termin-aus input[type=text] { width: 200px !important; padding: 4px 8px !important; }
.bilder { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.bildwahl { width: 92px; height: 70px; border: 2px solid var(--w-rand); border-radius: 8px; background: #f3f1ec center/contain no-repeat; cursor: pointer; font-size: 12.5px; color: var(--w-leise); }
.bildwahl.an { border-color: var(--w-akzent); box-shadow: 0 0 0 2px #1f5f8b40; }
.fallen { outline: 3px dashed var(--w-akzent); outline-offset: -6px; }
#vorschau { padding: 20px; border-left: 1px solid var(--w-rand); background: #e9e6df; }
#vorschau .rahmen { width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; box-shadow: 0 6px 24px #0003; }
.unter { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.unter .frei { flex: 1; }
.info { margin-top: 14px; font-size: 13.5px; color: var(--w-leise); }
.info b { color: var(--w-text); }
#schleier { position: fixed; inset: 0; background: #0007; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 20px; }
#schleier .fenster { background: #fff; color: #1e242c; border-radius: 14px; padding: 24px 26px; max-width: 520px; font-size: 15.5px; line-height: 1.5; box-shadow: 0 20px 60px #0006; }
#schleier h3 { font-size: 18px; margin-bottom: 10px; }
#schleier p { margin-bottom: 10px; white-space: pre-line; }
#schleier .unter { justify-content: flex-end; margin-top: 18px; }
#schleier button { font: inherit; }
@media (max-width: 1100px) { .spalten { grid-template-columns: 240px 1fr; } #vorschau { display: none; } }
</style>
</head>

<script id="programm">
"use strict";
/* ===================================================================
   Aufbau dieses Programms
   1. Hilfen           – kleine Werkzeuge
   2. Daten            – Inhalte lesen, Bilder, Termine, nächster Beginn
   3. Bühne            – zeichnet Folien, Countdown, Schlussbild

   =================================================================== */

/* ---------- 1. Hilfen ---------- */
function h(tag, eig, ...kinder) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(eig || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value" || k === "checked" || k === "disabled") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  el.append(...kinder.flat(Infinity).filter(k => k != null && k !== false));
  return el;
}
const zz = n => String(n).padStart(2, "0");

};

function bildUrl(id) {
  const b = D.bilder[id];
  if (!b) return null;
  if (!bildSpeicher.has(id)) {
    try {
      const [kopf, rest] = b.url.split(",");
      const typ = kopf.slice(5).split(";")[0];
      let bytes;
      if (kopf.includes(";base64")) {
        const roh = atob(rest);
        bytes = new Uint8Array(roh.length);
        for (let i = 0; i < roh.length; i++) bytes[i] = roh.charCodeAt(i);
      } else bytes = new TextEncoder().encode(decodeURIComponent(rest));
      bildSpeicher.set(id, URL.createObjectURL(new Blob([bytes], { type: typ })));
    } catch { bildSpeicher.set(id, b.url); }
  }
  return bildSpeicher.get(id);
}

/* Wird eine Folie heute gezeigt? */
function folienStand(f, heute = tagText(new Date())) {
  if (f.anzeigen === false) return "ausgeblendet";
  if (f.bis && heute > f.bis) return "abgelaufen";
  if (f.von && heute < f.von) return "spaeter";
  return "sichtbar";
}
const sichtbareFolien = () => D.folien.filter(f => folienStand(f) === "sichtbar");

/* Beginn des nächsten Gottesdienstes (normal oder früher) */
function beginnAm(tag, E) {
  const frueh = (E.frueherAnTerminen || []).includes(tagText(tag)) ||
                (E.frueherAmSonntagNr > 0 && Math.ceil(tag.getDate() / 7) === Number(E.frueherAmSonntagNr));
  const [std, min] = String((frueh ? E.frueherBeginn : E.beginn) || "10:00").split(":").map(Number);
  const z = new Date(tag);
  z.setHours(std || 0, min || 0, 0, 0);
  return z;
}
const NACHLAUF = 3 * 3600 * 1000;          // so lange bleibt das Schlussbild stehen
function naechsterBeginn(E, jetzt = new Date()) {
  const tag = new Date(jetzt);
  tag.setDate(tag.getDate() + ((Number(E.wochentag) - tag.getDay() + 7) % 7));
  let z = beginnAm(tag, E);
  if (jetzt - z > NACHLAUF) { tag.setDate(tag.getDate() + 7); z = beginnAm(tag, E); }
  return z;
}

/* ---------- 3. Bühne ---------- */
function baueFolie(f) {
  const url = f.bild ? bildUrl(f.bild) : null;
  const art = url ? ({ voll: "voll", hinter: "hinter" }[f.bildArt] || "seite") : "text";
  const hatTermine = (f.termine || []).length > 0;
  const s = h("section", { class: `folie art-${art}${f.ausfall ? " abgesagt" : ""}${hatTermine ? " kompakt" : ""}` });
  if (url) s.append(h("div", { class: "bildflaeche" },
    art === "voll" && h("img", { class: "weich", src: url, alt: "" }),
    h("img", { class: "bild", src: url, alt: "" })));
  if (art === "voll") return s;
  const satz = h("div", { class: "satz", style: "display:flex;flex-direction:column;align-items:flex-start" },
    f.rubrik && h("div", { class: "rubrik" }, f.rubrik),
    f.titel && h("div", { class: "titel" }, f.titel),
    f.ausfall && h("div", { class: "marke" }, f.ausfall),
    f.wann && h("div", { class: "wann" }, f.wann),
    f.bibelstelle && h("div", { class: "stelle" }, f.bibelstelle),
    f.text && h("div", { class: "text" }, f.text),
    hatTermine && h("div", { class: "termine" }, f.termine.map(t => [
      h("span", { class: "zeit" + (t.ausfall ? " aus" : "") }, t.zeit || ""),
      h("span", { class: "name" + (t.ausfall ? " aus" : "") }, t.name || ""),
      t.ausfall ? h("span", { class: "notiz" }, h("b", { class: "marke" }, t.ausfall))
                : h("span", { class: "notiz" }, t.notiz || ""),
    ])));
  s.append(h("div", { class: "inhalt" }, satz));
  return s;
}
/* Passt der Text nicht auf die Folie, wird er schrittweise kleiner. */
function einpassen(folie) {
  const inhalt = folie.querySelector(".inhalt");
  if (!inhalt) return;
  const satz = inhalt.firstChild;
  let f = 1;
  inhalt.style.setProperty("--f", f);
  while (f > 0.4 && (satz.offsetHeight > inhalt.clientHeight || satz.scrollWidth > inhalt.clientWidth + 2)) {
    f -= 0.05;
    inhalt.style.setProperty("--f", f.toFixed(2));
  }
}

/* still = steht (Vorschau, Miniatur); sonst läuft sie von selbst weiter */
function Buehne(rahmen, { still = false, miniatur = false } = {}) {
  const RING = 2 * Math.PI * 430;
  const folienBox = h("div"), punkte = h("div", { class: "punkte" }), gemeinde = h("div", { class: "gemeinde" });
  const uhrZahl = h("strong", {}, "–:––"), uhr = h("div", { class: "uhr" }, h("span", {}, "Beginn in"), uhrZahl);
  const fortschritt = h("b"), pause = h("div", { class: "pause", hidden: true }, "❚❚ Pause");
  const ring = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  ring.setAttribute("viewBox", "0 0 900 900");
  ring.innerHTML = `<circle class="spur" cx="450" cy="450" r="430"/><circle class="ring" cx="450" cy="450" r="430" stroke-dasharray="${RING}"/>`;
  const grossZahl = h("strong"), grossText = h("em");
  const gross = h("div", { class: "gross" }, h("div", { class: "licht a" }), h("div", { class: "licht b" }), ring, h("span", {}, "Gleich geht’s los"), grossZahl, grossText);
  const b = h("div", { class: "buehne" }, h("div", { class: "licht a" }), h("div", { class: "licht b" }), folienBox,
    h("div", { class: "fuss" }, gemeinde, punkte, uhr), h("div", { class: "balken" }, fortschritt), pause, gross);
  rahmen.classList.add("rahmen");
  rahmen.append(b);
  const skalieren = () => { b.style.transform = `translate(-50%, -50%) scale(${Math.min(rahmen.clientWidth / 1920, rahmen.clientHeight / 1080)})`; };
  new ResizeObserver(skalieren).observe(rahmen);
  skalieren();

  let folien = [], elemente = [], nr = 0, takt = null, haelt = false, festesZiel = null, uhrTakt = null;
  const E = () => D.einstellungen;

  function rahmenwerk() {
    b.className = "buehne " + (E().stimmung === "morgen" ? "morgen" : "nacht") + (still ? " still" : "");
    gemeinde.textContent = E().gemeinde || "";
    grossText.textContent = E().schlussText || "";
    uhr.style.visibility = E().countdownZeigen === false ? "hidden" : "";
  }
  function aufbauen(liste, aktiv, punktZahl = liste.length, punktAn = aktiv) {
    rahmenwerk();
    folien = liste;
    elemente = liste.map(baueFolie);
    folienBox.replaceChildren(...elemente);
    elemente.forEach(einpassen);
    punkte.replaceChildren(...Array.from({ length: punktZahl }, (_, i) => h("i", { class: i === punktAn ? "an" : "" })));
    nr = aktiv;
    elemente.forEach((el, i) => el.classList.toggle("aktiv", i === nr));
  }
  function zeige(i) {
    clearTimeout(takt);
    if (!elemente.length) return;
    if (i >= elemente.length) {               // Runde zu Ende: sind inzwischen andere Folien dran (Datum)?
      const neu = sichtbareFolien();
      if (neu.length !== folien.length || neu.some((f, k) => f !== folien[k])) return start();
    }
    nr = (i + elemente.length) % elemente.length;
    elemente.forEach((el, k) => el.classList.toggle("aktiv", k === nr));
    [...punkte.children].forEach((p, k) => p.classList.toggle("an", k === nr));
    const sek = Number(folien[nr].sekunden) || Number(E().sekundenProFolie) || 12;
    fortschritt.classList.remove("laeuft", "halt");
    void fortschritt.offsetWidth;             // Balken neu starten
    fortschritt.style.animationDuration = sek + "s";
    fortschritt.classList.add("laeuft");
    if (haelt) fortschritt.classList.add("halt");
    else takt = setTimeout(() => zeige(nr + 1), sek * 1000);
  }
  function start() {
    let liste = sichtbareFolien();
    if (!liste.length) liste = [{ titel: E().gemeinde }];
    aufbauen(liste, 0);
    zeige(0);
    if (!uhrTakt) uhrTakt = setInterval(tick, 250);
    tick();
  }
  function einzeln(folie) {                     // Vorschau: genau diese Folie, stehend
    const sichtbar = sichtbareFolien();
    aufbauen([folie], 0, sichtbar.length, sichtbar.indexOf(folie));
    if (!miniatur && !uhrTakt) uhrTakt = setInterval(tick, 500);
    tick();
  }
  function tick() {
    const ziel = festesZiel || naechsterBeginn(E()).getTime();
    const rest = Math.ceil((ziel - Date.now()) / 1000);
    if (rest <= 0) {
      uhrZahl.textContent = "0:00";
      if (still) return;
      gross.className = "gross an ende";
      grossZahl.textContent = E().schlussTitel || "";
      return;
    }
    const std = Math.floor(rest / 3600), min = Math.floor(rest % 3600 / 60), sek = rest % 60;
    uhrZahl.textContent = std >= 24 ? `${Math.floor(std / 24)} T ${std % 24} h` : std ? `${std}:${zz(min)}:${zz(sek)}` : `${min}:${zz(sek)}`;
    const ab = Number(E().grosserCountdownAb) || 0;
    const letzte = !still && rest <= ab;
    gross.className = "gross" + (letzte ? " an" : "");
    if (letzte) {
      grossZahl.textContent = rest;
      ring.lastChild.style.strokeDashoffset = RING * (1 - rest / ab);
    }
  }
  return {
    start, einzeln, tick,
    weiter: () => zeige(nr + 1), zurueck: () => zeige(nr - 1),
    pause() { haelt = !haelt; pause.hidden = !haelt; zeige(nr); },
    probe(sekunden) { festesZiel = sekunden ? Date.now() + sekunden * 1000 : null; gross.className = "gross"; },
    stopp() { clearTimeout(takt); clearInterval(uhrTakt); uhrTakt = null; },
  };
}

const anzeigeEl = h("div", { id: "anzeige" }, h("div", {}));

/* Vollbild. Ist ein zweiter Bildschirm (Beamer) angeschlossen, geht die Anzeige dorthin –
   das können Edge und Chrome, und sie fragen beim ersten Mal um Erlaubnis. Sonst: dieser Bildschirm. */
function vollbild() {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) return (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  const an = ziel => (el.requestFullscreen || el.webkitRequestFullscreen).call(el, ziel ? { screen: ziel } : undefined);
  if (!screen.isExtended || !window.getScreenDetails) return an();
  getScreenDetails()
    .then(alle => {
      const zweite = alle.screens.filter(s => !s.isPrimary);
      return an(zweite.find(s => !s.isInternal) || zweite[0]);
    }, () => an())   // Erlaubnis abgelehnt: Vollbild auf diesem Bildschirm
    .catch(() => {
      // Über der Erlaubnis-Frage ist der Tastendruck verfallen – der nächste klappt.
      const text = leiste.firstChild.textContent;
      leiste.firstChild.textContent = "Bitte noch einmal F drücken";
      setTimeout(() => { leiste.firstChild.textContent = text; }, 6000);
      wach();
    });
}
let ruheTakt;
function wach() {
  document.body.classList.remove("ruhig");
  clearTimeout(ruheTakt);
  ruheTakt = setTimeout(() => document.body.classList.add("ruhig"), 3000);
}
addEventListener("mousemove", wach);
anzeigeEl.addEventListener("dblclick", vollbild);
addEventListener("keydown", e => {
  if (aktuellerModus !== "anzeige" || document.getElementById("schleier")) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (aktuellerModus === "bearbeiten") speichern(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "f") vollbild();
  else if (k === "e") modus("bearbeiten");
  else if (k === "arrowright" || k === "pagedown") live.weiter();
  else if (k === "arrowleft" || k === "pageup") live.zurueck();
  else if (k === " ") { e.preventDefault(); live.pause(); }
});
/* Bildschirm wach halten, solange die Anzeige läuft (wo der Browser das kann) */
async function wachHalten() {
  try { if (navigator.wakeLock && document.visibilityState === "visible") wachSperre = await navigator.wakeLock.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => { if (aktuellerModus === "anzeige") wachHalten(); });

function modus(neu, probeSekunden) {
  aktuellerModus = neu;
  anzeigeEl.hidden = neu !== "anzeige";
  werkstatt.hidden = neu !== "bearbeiten";
  if (neu === "anzeige") {
    live.probe(probeSekunden || 0);
    live.start();
    wach();
    wachHalten();
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  } else {
    live.stopp();
    if (wachSperre) { wachSperre.release().catch(() => {}); wachSperre = null; }
    if ((document.fullscreenElement || document.webkitFullscreenElement)) vollbild();
    document.body.classList.remove("ruhig");
    history.replaceState(null, "", "#bearbeiten");
    bearbeitenAufbauen();
  }
}

/* ---------- 5. Bearbeiten ---------- */
let gewaehlt = 0, reiter = "folien", vorschau = null, miniaturen = [], standEl = null;

function meldung(titel, text, knoepfe = [["OK", true]]) {
  return new Promise(fertig => {
    const zu = wert => { schleier.remove(); fertig(wert); };
    const schleier = h("div", { id: "schleier" }, h("div", { class: "fenster" }, h("h3", {}, titel), h("p", {}, text),
      h("div", { class: "unter" }, knoepfe.map(([name, wert, haupt]) =>
        h("button", { class: "knopf" + (haupt ? " haupt" : ""), onclick: () => zu(wert) }, name)))));
    document.body.append(schleier);
    schleier.querySelector("button:last-child").focus();

}

function geaendert(nurDiese = true) {
  standEl.textContent = offen() ? "● Ungespeicherte Änderungen" : "Alles gespeichert";
  standEl.className = "stand" + (offen() ? " offen" : "");
  if (reiter === "folien" && D.folien[gewaehlt]) {
    vorschau.einzeln(D.folien[gewaehlt]);
    if (nurDiese) karteFuellen(gewaehlt); else listeZeichnen();
  } else if (D.folien.length) vorschau.einzeln(D.folien[Math.min(gewaehlt, D.folien.length - 1)]);
}

/* Eingabefelder: schreiben direkt in das Objekt und melden die Änderung */

    if (w === "" && o.leerLoeschen !== false) delete obj[key]; else obj[key] = w;
    geaendert(!o.alles);

  return h("label", { class: "haken" }, box, h("span", {}, titel));

const knopf = (text, klick, o = {}) => h("button", { class: "knopf " + (o.klasse || ""), title: o.titel, "aria-label": o.titel, disabled: o.aus, onclick: e => { e.stopPropagation(); klick(); } }, text);

function infoZeichnen() {

    stand === "spaeter" && h("span", { class: "schild gelb" }, "erst ab " + kurzDatum(f.von)),
    stand === "sichtbar" && f.bis && h("span", { class: "schild" }, "bis " + kurzDatum(f.bis)),
    (f.ausfall || (f.termine || []).some(t => t.ausfall)) && h("span", { class: "schild rot" }, "fällt aus")].filter(Boolean));

  const bloecke = [

    h("div", { class: "block" }, h("h2", {}, "Mehrere Termine untereinander", h("small", {}, "z. B. „Freitags bei uns“")),
      termine,
      knopf("+ Termin", () => { (f.termine = f.termine || []).push({ zeit: "", name: "" }); neuZeichnen(); }, { klasse: "klein" })),
    h("div", { class: "block" }, h("h2", {}, "Bild oder Flyer"),
      bildWahl, datei,
      knopf("Bild vom Rechner hinzufügen …", () => datei.click(), { klasse: "klein" }),

    h("div", { class: "unter" },

      h("span", { class: "frei" }),

        if (!await meldung("Folie löschen?", `„${f.titel || f.rubrik || "Leere Folie"}“ wird entfernt.\nTipp: Mit dem Haken „Diese Folie zeigen“ kannst du sie auch nur ausblenden.`, [["Abbrechen", false], ["Löschen", true, true]])) return;
        D.folien.splice(gewaehlt, 1); gewaehlt = Math.max(0, gewaehlt - 1); listeZeichnen(); formularZeichnen(); geaendert();

  const box = document.getElementById("formular");

/* Bild hinzufügen: große Fotos werden verkleinert, damit die Datei handlich bleibt */
const alsDataUrl = blob => new Promise((ok, fehler) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = fehler; r.readAsDataURL(blob); });
async function bildDazu(file, folie) {
  if (!file) return;
  try {
    if (!/^image\//.test(file.type)) throw new Error(file.type === "application/pdf"
      ? "Ein PDF kann hier nicht gezeigt werden. Mach ein Bildschirmfoto vom Flyer oder speichere ihn als Bild (JPG oder PNG)."
      : "Das ist kein Bild. Es gehen JPG, PNG, GIF, WebP und SVG.");
    let url;
    if (/svg|gif/.test(file.type) || file.size < 500e3) url = await alsDataUrl(file);
    else {
      const quelle = URL.createObjectURL(file);
      const bild = await new Promise((ok, fehler) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => fehler(new Error("Das Bild lässt sich nicht lesen.")); i.src = quelle; });
      const faktor = Math.min(1, 2400 / Math.max(bild.naturalWidth, bild.naturalHeight));
      const c = h("canvas", { width: Math.round(bild.naturalWidth * faktor), height: Math.round(bild.naturalHeight * faktor) });
      const stift = c.getContext("2d");
      const zeichne = weiss => { if (weiss) { stift.fillStyle = "#fff"; stift.fillRect(0, 0, c.width, c.height); } else stift.clearRect(0, 0, c.width, c.height); stift.drawImage(bild, 0, 0, c.width, c.height); };
      zeichne(false);
      url = file.type === "image/png" ? c.toDataURL("image/png") : "";
      if (!url || url.length > 2.5e6) { zeichne(true); url = c.toDataURL("image/jpeg", 0.88); }
      URL.revokeObjectURL(quelle);
    }
    let id = Object.keys(D.bilder).find(k => D.bilder[k].url === url);
    if (!id) { id = neueId("b"); D.bilder[id] = { name: file.name, url }; }
    folie.bild = id;
    folie.bildArt = folie.bildArt || "seite";
    formularZeichnen(); geaendert();
  } catch (err) { meldung("Das Bild konnte nicht hinzugefügt werden", err.message || String(err)); }
}

/* ---------- 6. Speichern: die Datei schreibt sich selbst neu ---------- */
const dateiName = decodeURIComponent(location.pathname.split("/").pop() || "") || "Ansagen.html";
function dateiText() {
  const zu = "<" + "/script>";
  const json = JSON.stringify(D).replace(/</g, "\\u003c");
  return `<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ansagen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style id="stil">${document.getElementById("stil").textContent}<` + `/style>
</head>
<body>
<script id="daten" type="application/json">${json}${zu}
<script id="programm">${document.getElementById("programm").textContent}${zu}
</body>
</html>
`;
}
/* Der Browser merkt sich, welche Datei er beschreiben darf (nur Chrome und Edge können das). */
function griffLager(aktion, wert) {
  return new Promise(fertig => {
    try {
      const auf = indexedDB.open("ansagen", 1);
      auf.onupgradeneeded = () => auf.result.createObjectStore("griffe");
      auf.onerror = () => fertig(null);
      auf.onsuccess = () => {
        const lager = auf.result.transaction("griffe", "readwrite").objectStore("griffe");
        const a = aktion === "lesen" ? lager.get(location.pathname) : aktion === "merken" ? lager.put(wert, location.pathname) : lager.delete(location.pathname);
        a.onsuccess = () => fertig(a.result || null);
        a.onerror = () => fertig(null);
      };
    } catch { fertig(null); }
  });
}
let griff = null, helfer = false, herunterladenErklaert = false;
if (location.protocol.startsWith("http")) fetch("/api/ping").then(r => r.json()).then(j => { helfer = j.ansagenHelfer === true; }).catch(() => {});

async function schreibeMitGriff(text) {
  if (!griff) griff = await griffLager("lesen");
  for (let versuch = 0; versuch < 2; versuch++) {
    if (!griff) {
      const weiter = await meldung("Einmal die Datei zeigen",
        `Gleich fragt der Browser, wohin gespeichert werden soll.\n\nWähle dort die Datei „${dateiName}“ in deinem Ansagen-Ordner aus und bestätige, dass sie ersetzt werden darf. Danach geht Speichern mit einem Klick.`,
        [["Abbrechen", false], ["Weiter", true, true]]);
      if (!weiter) return false;
      griff = await window.showSaveFilePicker({ suggestedName: dateiName, types: [{ description: "Ansagen", accept: { "text/html": [".html"] } }] });
    }
    try {
      if (await griff.queryPermission({ mode: "readwrite" }) !== "granted" && await griff.requestPermission({ mode: "readwrite" }) !== "granted")
        throw Object.assign(new Error("Der Browser hat das Speichern nicht erlaubt."), { name: "Erlaubnis" });
      const schreiber = await griff.createWritable();
      await schreiber.write(text);
      await schreiber.close();
      await griffLager("merken", griff);
      return true;
    } catch (err) {
      if (err.name === "Erlaubnis" || versuch) throw err;
      griff = null;                          // Datei wurde verschoben oder gelöscht: neu wählen lassen
      await griffLager("vergessen");
    }
  }
}
async function speichern() {
  const alt = { vorher: D.vorher, gespeichert: D.gespeichert, bilder: D.bilder };
  try {
    if (offen()) D.vorher = gespeicherterKern;
    D.gespeichert = new Date().toISOString();
    const gebraucht = new Set([...D.folien, ...(D.vorher ? JSON.parse(D.vorher).folien : [])].map(f => f.bild));
    D.bilder = Object.fromEntries(Object.entries(D.bilder).filter(([id]) => gebraucht.has(id)));   // unbenutzte Bilder fliegen raus
    const text = dateiText();
    if (helfer) {
      const antwort = await fetch("/api/speichern", { method: "POST", headers: { "X-Ansagen": "1", "Content-Type": "text/html" }, body: text });
      if (!antwort.ok) throw new Error((await antwort.text()) || "Der Helfer konnte nicht schreiben.");
    } else if (window.showSaveFilePicker) {
      if (!await schreibeMitGriff(text)) { Object.assign(D, alt); return; }
    } else {
      const a = h("a", { href: URL.createObjectURL(new Blob([text], { type: "text/html" })), download: dateiName });
      document.body.append(a); a.click(); a.remove();
      if (!herunterladenErklaert) await meldung("Die neue Datei liegt bei den Downloads",
        `Dieser Browser darf Dateien nicht direkt überschreiben. Deshalb wurde eine neue „${dateiName}“ heruntergeladen.\n\nSchiebe sie in deinen Ansagen-Ordner und ersetze dort die alte Datei.\n\nBequemer: Öffne die Ansagen in Chrome oder Edge – oder am Mac über „Ansagen bearbeiten (Mac)“ im Ordner „Für den Mac“. Dann speichert ein Klick direkt.`);
      herunterladenErklaert = true;
    }
    gespeicherterKern = kern();
    if (aktuellerModus === "bearbeiten") { geaendert(); if (reiter === "einstellungen") formularZeichnen(); }
  } catch (err) {
    Object.assign(D, alt);
    if (err.name !== "AbortError") meldung("Speichern hat nicht geklappt", (err.message || String(err)) + "\n\nDeine Änderungen sind noch da – lass dieses Fenster offen und versuche es noch einmal.");
  }
}
